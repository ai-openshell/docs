# SPDX-License-Identifier: Apache-2.0

name: Bug Report
description: Report a problem with how the website builds, renders, or behaves.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Reports

        Search existing issues for possible duplicates before filing.

        This repository owns the website build, theme, navigation, search, and the pages outside the docs. Wrong or missing docs content belongs in the repository that owns the page, such as [ai-openshell/openshell](https://github.com/ai-openshell/openshell/issues) for the core docs. Do not report security vulnerabilities here; follow [SECURITY.md](https://github.com/ai-openshell/website/blob/main/SECURITY.md) instead.

  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page where the problem shows. Leave empty for a local build problem.
      placeholder: https://...

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, such as a broken link, a rendering or layout problem, search, navigation, the version picker, or a Markdown copy. Attach a screenshot for rendering or layout problems.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: The steps that show the problem and what you expected instead. For a build problem, include the command you ran.
      placeholder: |
        1. Open the page
        2. ...
        Expected: ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the browser and device. For a local build problem, include the commit and tool versions instead.
      placeholder: |
        - Browser: Firefox 140 / Chrome 142 / Safari 26
        - Device and OS: macOS 15.2 / Ubuntu 24.04 / iOS 26 (phone)
        - Docs version shown in the version picker: latest / 0.x.x / dev
        - Local build only: commit, `node --version`, `mise --version`

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Include the smallest relevant build output or browser console excerpt.
        Redact credentials, API keys, tokens, and query parameters before pasting.
      render: shell
