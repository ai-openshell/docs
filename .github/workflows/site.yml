# SPDX-License-Identifier: Apache-2.0

# Build the whole site from sources.yml and publish it to GitHub Pages.
#
# Runs on pull requests (build only), on changes to main, hourly (to pick up
# new commits on each source's dev branch), and on demand. A source repo can
# trigger it with repository_dispatch when it pushes main or a release tag.
name: Site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [docs-source-updated]

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      # Checkouts are keyed by commit, so old entries stay valid forever.
      - uses: actions/cache@v6
        with:
          path: .cache/sources
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      - run: npm ci
      - name: Check formatting and lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Assemble (fetches each source at its ref)
        run: node assembler/assemble.mjs --base /${{ github.event.repository.name }}/
      - name: Type-check
        run: npm run typecheck
      - name: Build site
        run: npm run site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - name: Record the commits this build used
        run: |
          echo '### Sources' >> "$GITHUB_STEP_SUMMARY"
          echo '| Version | Ref | Commit | Format |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          node -e 'for (const [k, v] of Object.entries(require("./build/assembled/sources.lock.json"))) console.log(`| ${k} | ${v.repo}@${v.ref} | ${v.sha.slice(0, 12)} | ${v.format} |`)' >> "$GITHUB_STEP_SUMMARY"
          cp build/assembled/sources.lock.json site/dist/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
