<!-- Theme toggle shared by the landing page (scripts/website.mjs) and the docs header (Header.astro). theme-toggle.js cycles auto, light, dark and sets data-theme-choice on <html>. Each host styles the button through the .theme-toggle class. -->
<button type="button" class="theme-toggle" aria-label="Theme: auto. Switch theme" title="Theme: auto">
  <svg viewBox="0 0 24 24" aria-hidden="true" class="theme-toggle__auto">
    <rect x="3" y="4.5" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.75" />
    <path d="M8 20h8M12 16.5V20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
  </svg>
  <svg viewBox="0 0 24 24" aria-hidden="true" class="theme-toggle__light">
    <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.75" />
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
  </svg>
  <svg viewBox="0 0 24 24" aria-hidden="true" class="theme-toggle__dark">
    <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" />
  </svg>
</button>
<style>
  .theme-toggle svg {
    width: 1.125rem;
    height: 1.125rem;
  }
  :root:not([data-theme-choice="light"]) .theme-toggle__light,
  :root:not([data-theme-choice="dark"]) .theme-toggle__dark,
  :root[data-theme-choice="light"] .theme-toggle__auto,
  :root[data-theme-choice="dark"] .theme-toggle__auto {
    display: none;
  }
</style>
