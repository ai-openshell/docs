# Netlify build settings. These override the settings in the Netlify UI.
# `npm run build` fetches the sources and assembles the pages before
# building the site; `npm run site` alone expects them to be assembled already.
# Netlify serves the site at the root, so BASE_PATH stays unset.

[build]
command = "npm run build"
publish = "site/dist"
