# The site needs only Node.js (and git, to fetch the sources). Run
# `mise install`, then `mise tasks` to list the tasks.

[tools]
node = "24.20.0"

[tasks.install]
description = "Install npm dependencies"
run = "npm ci"

[tasks.assemble]
description = "Fetch every source in sources.yml and assemble the pages"
run = "node assembler/assemble.mjs --base /docs/"

[tasks.build]
description = "Assemble and build the site into site/dist"
depends = ["assemble"]
env = { BASE_PATH = "/docs/" }
run = "npm run site"

[tasks.website]
description = "Build the site, then add the landing page at / with the docs at /docs/"
depends = ["build"]
run = "npm run website"

[tasks.serve-website]
description = "Serve the website at http://127.0.0.1:4410/"
run = "node scripts/serve.mjs build/website 4410 /"

[tasks.test]
description = "Run the unit tests for the assembler"
run = "npm test"

[tasks.lint]
description = "Check formatting and lint with Biome"
run = "npm run lint"

[tasks.typecheck]
description = "Type-check the site (needs the assembled sources)"
depends = ["assemble"]
run = "npm run typecheck"

[tasks.format]
description = "Format the code and apply safe lint fixes"
run = "npm run format"

[tasks.serve]
description = "Serve the built site at http://127.0.0.1:4410/docs/"
run = "node scripts/serve.mjs site/dist 4410 /docs/"
