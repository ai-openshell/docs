# Which repos feed the site, where each is mounted, and which of its releases
# are published.
#
# Nothing is copied into this repo. The build resolves each `ref` (a tag, a
# branch or a commit) to a commit, fetches only `path` at that commit, and
# records the commit in build/sources.lock.json.
#
# Every source has its own versions, newest first. The first one is "latest".
# `dev` (optional) is a branch built as an extra, unreleased version.
# `archive` (optional) is a URL where versions this site no longer publishes
# are still hosted. The version picker and llms.txt link to it.
#
# The newest release is published at /<mount>/<page>, with no version in the
# URL; every other version at /<mount>/<version>/<page>. /<mount>/latest/<page>
# and /<mount>/<newest>/<page> redirect to /<mount>/<page>. Core is mounted at
# the root (/about/overview/, /0.1.8/about/overview/, /dev/...).
#
# The format of each checkout is detected: docs/docset.yml (native),
# docs/index.yml (Fern) or SUMMARY.md (mdBook). Old tags build as they are.
#
# Topics are the header tabs, shown when there are several. A topic with a `description` or several sources
# gets an overview page at /<id>/ (with an optional `intro` from this repo) and
# sub-tabs for the overview and each source. Otherwise its tab opens its only
# source.
site:
  title: OpenShell
  repo: ai-openshell/website
  url: https://ai-openshell.github.io/website

topics:
  - id: core
    label: Core
    sources: [core]

sources:
  core:
    title: OpenShell
    description: The safe, private runtime for autonomous AI agents.
    mount: ""
    repo: ai-openshell/openshell
    path: docs
    dev: { ref: main }
    archive: https://docs.nvidia.com/openshell/
    versions:
      - { name: "0.1.10", ref: v0.1.10 }
